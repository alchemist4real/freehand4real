<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>freehand4real - Camera Permission</title>
  <style>
    * {
      box-sizing: border-box !important;
      margin: 0 !important;
      padding: 0 !important;
      font-family: 'Times New Roman', Times, serif !important;
    }
    body {
      background: #ffffff !important;
      color: #111827 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      min-height: 100vh !important;
      padding: 20px !important;
    }
    .card {
      max-width: 440px !important;
      width: 100% !important;
      border: 1px solid #111827 !important;
      border-radius: 8px !important;
      padding: 28px !important;
      text-align: center !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 16px !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08) !important;
    }
    h1 {
      font-size: 22px !important;
      font-weight: 700 !important;
    }
    p {
      font-size: 14px !important;
      color: #4b5563 !important;
      line-height: 1.5 !important;
    }
    .btn {
      background: #111827 !important;
      color: #ffffff !important;
      border: 1px solid #111827 !important;
      padding: 10px 20px !important;
      border-radius: 4px !important;
      font-size: 14px !important;
      font-weight: 700 !important;
      cursor: pointer !important;
      transition: opacity 0.15s ease !important;
    }
    .btn:hover {
      opacity: 0.9 !important;
    }
    .status {
      font-size: 13px !important;
      font-weight: 700 !important;
      padding: 8px !important;
      border-radius: 4px !important;
      background: #f3f4f6 !important;
      display: none !important;
    }
    .status.success {
      display: block !important;
      background: #ecfdf5 !important;
      color: #065f46 !important;
      border: 1px solid #10b981 !important;
    }
    .status.error {
      display: block !important;
      background: #fef2f2 !important;
      color: #991b1b !important;
      border: 1px solid #ef4444 !important;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Camera Access Required</h1>
    <p>To enable hand gesture tracking and air cursor navigation, please allow camera access when prompted by your browser.</p>
    <button id="btn-request" class="btn">Allow Camera</button>
    <div id="status-box" class="status"></div>
  </div>
  <script src="permission.js"></script>
</body>
</html>
